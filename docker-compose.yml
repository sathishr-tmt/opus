# Optional local MongoDB service for OPUS.
# Start:  docker compose up -d db
# Stop:   docker compose down
# Data persists in the named volume.

services:
  db:
    image: mongo:8.0
    container_name: opus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - opus_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opus_mongodb_data: